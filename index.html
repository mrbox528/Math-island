<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数学岛冒险</title>

<meta name="theme-color" content="#8f55ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="数学岛冒险">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{
  --ink:#243447;
  --shadow:0 12px 30px rgba(34,54,78,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:"Arial Rounded MT Bold","Trebuchet MS","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(#dff2ff,#ffffff);
  min-height:100vh;
  overflow-x:hidden;
}
button{font:inherit}
.hidden{display:none!important}
.screen{min-height:100vh;padding:14px}
.topbar{max-width:980px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:clamp(24px,5vw,42px);font-weight:900}
.pill{
  background:#fff;border:2px solid #d8e6f4;border-radius:999px;
  padding:10px 14px;box-shadow:0 4px 12px #00000010;font-weight:900;
}
.btn{
  border:0;border-radius:18px;padding:13px 20px;background:linear-gradient(180deg,#ffd166,#ffb703);
  color:#5a3900;font-weight:900;box-shadow:0 6px 0 #d99100,0 10px 20px #0002;cursor:pointer;
}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d99100,0 5px 12px #0002}
.btn.secondary{background:linear-gradient(180deg,#eef7ff,#d7ebff);color:#28445f;box-shadow:0 6px 0 #aac9e8,0 10px 20px #0002}

#mapScreen{background:linear-gradient(#cdeeff 0 16%,#e8f7ff 16% 100%)}
.map-wrap{max-width:980px;margin:0 auto;background:#ffffffc7;border:3px solid #fff;border-radius:34px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.map-title{text-align:center;margin:4px 0 16px;font-size:clamp(30px,6vw,48px)}
.worlds{display:grid;gap:18px}
.world{border-radius:26px;padding:14px;border:3px solid #ffffffaa;box-shadow:inset 0 0 0 1px #00000008}
.world h3{margin:0 0 10px;font-size:22px}
.forest{background:linear-gradient(135deg,#c9f7c0,#82d173)}
.desert{background:linear-gradient(135deg,#ffe29a,#efc66c)}
.snow{background:linear-gradient(135deg,#eefaff,#cbe8ff)}
.grass{background:linear-gradient(135deg,#d9f99d,#a7e56a)}
.fire{background:radial-gradient(circle at 30% 20%,#ffdd66 0 7%,transparent 8%),linear-gradient(135deg,#ff8c42,#d7263d 58%,#541212)}
.level-row{display:grid;grid-template-columns:repeat(5,minmax(54px,1fr));gap:10px}
.level{min-height:78px;border:0;border-radius:20px;background:#fff8;padding:8px 4px;font-weight:900;color:#234;box-shadow:0 4px 12px #0002;cursor:pointer;transition:.2s transform,.2s opacity}
.level:hover:not(.locked){transform:translateY(-3px)}
.level.locked{filter:grayscale(1);opacity:.48;cursor:not-allowed}
.level .num{font-size:24px;display:block}
.level .stars{font-size:14px;display:block;min-height:18px}
.level .lock{font-size:20px}
.level.boss{color:#fff;background:#5a1717aa}
.legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}

#gameScreen{position:relative;overflow:hidden;background:linear-gradient(#9fd8ff 0 58%,#cae899 58% 100%)}
#gameScreen.desert-scene{background:linear-gradient(#a8dcff 0 58%,#e3c977 58% 100%)}
#gameScreen.snow-scene{background:linear-gradient(#c4ebff 0 54%,#eef8ff 54% 100%)}
#gameScreen.grass-scene{background:linear-gradient(#9ad5ff 0 57%,#92d467 57% 100%)}
#gameScreen.fire-scene{background:radial-gradient(circle at 20% 16%,#ffcf43 0 3%,transparent 4%),linear-gradient(#351114 0 56%,#822719 56% 100%)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;filter:drop-shadow(0 5px 8px #0001)}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:44px;height:44px;left:14px;top:-20px}
.cloud:after{width:32px;height:32px;right:18px;top:-13px}
.cloud.c1{width:115px;height:30px;top:12%;left:6%}
.cloud.c2{width:100px;height:28px;top:9%;right:9%}

.hud{position:relative;z-index:4;max-width:980px;margin:auto;display:grid;grid-template-columns:auto auto auto auto;gap:10px;align-items:center}
.star-panel{display:flex;align-items:center;gap:10px}

.arena{position:relative;z-index:2;max-width:980px;height:455px;margin:6px auto 0}

/* MONSTER */
.monster{
  position:absolute;left:50%;top:28px;transform:translateX(-50%);
  width:270px;height:260px;transition:.25s;filter:drop-shadow(0 14px 20px rgba(0,0,0,.22));
}
.monster.shake{animation:shake .35s}
@keyframes shake{
  0%,100%{transform:translateX(-50%)}
  20%{transform:translateX(calc(-50% - 10px)) rotate(-3deg)}
  40%{transform:translateX(calc(-50% + 10px)) rotate(3deg)}
  60%{transform:translateX(calc(-50% - 8px))}
  80%{transform:translateX(calc(-50% + 8px))}
}
.monster.burst{animation:burst .55s forwards}
@keyframes burst{
  25%{transform:translateX(-50%) scale(1.14)}
  60%{transform:translateX(-50%) scale(.7) rotate(14deg);opacity:.65}
  100%{transform:translateX(-50%) scale(.05) rotate(32deg);opacity:0}
}
.horn{position:absolute;top:-6px;width:42px;height:112px;background:repeating-linear-gradient(180deg,#e9d2ef 0 18px,#7b1ba1 18px 36px);border:4px solid #1f1730;border-radius:60% 60% 18% 18%;z-index:1}
.horn.left{left:42px;transform:rotate(-26deg)}
.horn.right{right:42px;transform:rotate(26deg)}
.body{
  position:absolute;left:20px;right:20px;top:34px;bottom:42px;
  background:#c88adb;border:5px solid #1d1630;border-radius:44% 42% 46% 44%/40% 40% 52% 50%;
  box-shadow:inset 0 -10px 0 #b56bcc;
}
.fluff{
  position:absolute;left:12px;right:12px;bottom:38px;height:70px;
  background:
    radial-gradient(circle at 8% 42%, #c88adb 0 30px, transparent 31px),
    radial-gradient(circle at 22% 58%, #c88adb 0 28px, transparent 29px),
    radial-gradient(circle at 38% 48%, #c88adb 0 32px, transparent 33px),
    radial-gradient(circle at 52% 58%, #c88adb 0 28px, transparent 29px),
    radial-gradient(circle at 68% 48%, #c88adb 0 32px, transparent 33px),

  filter:drop-shadow(0 2px 0 #1d1630);
}
.eye{
  position:absolute;left:50%;top:66px;transform:translateX(-50%);

/* HERO VEHICLE */

.core-shadow{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:250px;height:120px;background:radial-gradient(ellipse at center, rgba(255,120,0,.18), rgba(0,0,0,0) 70%);filter:blur(8px)}

.engine.right{right:34px}
.engine:after{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,#252836 0 18px,#0b0d13 19px 100%);border:4px solid rgba(255,180,80,.35)}
.wing{
  position:absolute;top:48px;width:132px;height:56px;background:linear-gradient(180deg,#151b26,#394050 52%,#111722);

}
.wing.left{left:70px;transform:skewX(-10deg)}

  position:absolute;left:50%;top:18px;transform:translateX(-50%);

  position:absolute;left:50%;top:34px;transform:translateX(-50%);

.shell{

}
.shell.fly{display:flex;animation:shoot .62s ease-in forwards}
@keyframes shoot{0%{transform:translateX(-50%) translateY(0) scale(.7)}100%{transform:translateX(-50%) translateY(-260px) scale(1.05)}}

.combo{position:absolute;left:50%;top:2px;transform:translateX(-50%);font-size:34px;font-weight:1000;color:#ff7b00;text-shadow:0 3px #fff;opacity:0;z-index:8}
.combo.show{animation:comboPop .8s}
@keyframes comboPop{0%{transform:translateX(-50%) scale(.4);opacity:0}30%,70%{transform:translateX(-50%) scale(1.2);opacity:1}100%{opacity:0}}
.feedback{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:10;background:#fff;border-radius:999px;padding:7px 15px;font-weight:900;opacity:0}
.feedback.show{animation:fadeMsg 1s}
@keyframes fadeMsg{15%,75%{opacity:1}100%{opacity:0}}

.controls{position:relative;z-index:5;max-width:460px;margin:-2px auto 0;background:#ffffffdd;border:3px solid #fff;border-radius:28px;padding:14px;box-shadow:var(--shadow)}
.answer-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}

.mini-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8c9d8}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 #b8c9d8;padding:16px 4px;font-size:26px;font-weight:1000;color:#234;cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #b8c9d8}
.key.fire{grid-column:2 / span 2;background:#ffb703;box-shadow:0 5px 0 #d58c00;color:#553900}

.modal{position:fixed;inset:0;background:#17324cbb;display:flex;align-items:center;justify-content:center;padding:18px;z-index:99}
.card{width:min(540px,94vw);background:#fff;border-radius:30px;padding:24px;text-align:center;box-shadow:0 25px 80px #0005}
.card h2{font-size:34px;margin:0 0 10px}
.score-big{font-size:48px;font-weight:1000;color:#ff9f1c;margin:12px 0}
.card p{line-height:1.6}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:#ffd166;pointer-events:none;z-index:7;animation:spark .6s forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

@media (max-width:700px){
  .screen{padding:10px}
  .hud{grid-template-columns:1fr 1fr}
  .star-panel{justify-content:flex-end}
  .arena{height:420px}
  .monster{width:230px;height:230px;top:24px}
  .body{left:14px;right:14px}
  .mouth{width:148px;height:72px;top:122px}
  .problem{font-size:23px}
  .hero{width:310px;height:145px;bottom:30px;transform:translateX(-50%) scale(.9)}
  .engine{width:86px;height:86px;top:28px}
  .engine.left{left:24px} .engine.right{right:24px}
  .main-body{width:176px;height:118px}
  .nose{width:62px;height:98px}
  .barrel.left{left:122px} .barrel.right{right:122px}
  .light-strip.l1{left:98px} .light-strip.l2{right:98px}
  .controls{max-width:430px}
}
</style>
</head>
<body>
<section id="mapScreen" class="screen">
  <div class="topbar">
    <div class="brand">🏝️ 数学岛冒险</div>
    <div class="pill">⭐ 总星星：<span id="totalStars">0</span></div>
  </div>
  <div class="map-wrap">
    <h1 class="map-title">选择关卡</h1>
    <div class="worlds">
      <div class="world forest"><h3>🌲 森林 · 1–5关</h3><div class="level-row" id="forestLevels"></div></div>
      <div class="world desert"><h3>🏜️ 沙漠 · 6–10关</h3><div class="level-row" id="desertLevels"></div></div>
      <div class="world snow"><h3>❄️ 雪地 · 11–15关</h3><div class="level-row" id="snowLevels"></div></div>
      <div class="world grass"><h3>🌿 草原 · 16–19关</h3><div class="level-row" id="grassLevels"></div></div>
      <div class="world fire"><h3 style="color:white">🔥 火焰之地 · Boss</h3><div class="level-row" id="fireLevels"></div></div>
    </div>
    <div class="legend">
      <button class="btn secondary" id="soundBtn">🔊 音效：开</button>
      <button class="btn secondary" id="resetBtn">↺ 重置进度</button>

  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="hud">
    <button class="btn secondary" id="backBtn">← 地图</button>
    <div class="pill">关卡 <span id="levelLabel">1</span></div>
    <div class="pill timer">⏱ <span id="timeLeft">60</span>s</div>
    <div class="pill star-panel"><div class="avatar"></div><div>⭐ <span id="levelStars">0</span></div></div>
  </div>

  <div class="arena">
    <div id="combo" class="combo">COMBO ×2!</div>
    <div id="monster" class="monster">
      <div class="horn left"></div>
      <div class="horn right"></div>
      <div class="arm left"><div class="hand"></div></div>
      <div class="arm right"><div class="hand"></div></div>
      <div class="body"></div>
      <div class="fluff"></div>
      <div class="eye-brow"></div>
      <div class="eye"><div class="lid"></div><div class="pupil"></div></div>
      <div class="mouth">
        <div class="tooth t1"></div><div class="tooth t2"></div><div class="tooth t3"></div><div class="tooth t4"></div>
        <div id="problem" class="problem">8 + 7 = ?</div>
      </div>
      <div class="leg left"><div class="foot"></div></div>
      <div class="leg right"><div class="foot"></div></div>
    </div>

    <div class="hero">
      <div class="core-shadow"></div>
      <div class="engine left"></div>
      <div class="engine right"></div>
      <div class="wing left"></div>
      <div class="wing right"></div>

      <div class="nose"></div>
      <div class="fin left"></div>
      <div class="fin right"></div>
      <div class="cockpit"></div>
      <div class="barrel left"><div class="muzzle"></div></div>
      <div class="barrel right"><div class="muzzle"></div></div>
      <div class="light-strip l1"></div>
      <div class="light-strip l2"></div>
      <div class="light-strip l3"></div>
      <div class="fire-glow g1"></div>
      <div class="fire-glow g2"></div>

    <div id="shell" class="shell">15</div>

  </div>

  <div class="controls">
    <div class="answer-row">
      <div id="answerDisplay" class="answer-display">—</div>

      <button class="key" data-n="1">1</button>
      <button class="key" data-n="2">2</button>

</section>

<div id="modal" class="modal hidden">

</div>

<script>
(()=>{
"use strict";
const $ = s => document.querySelector(s);
const mapScreen=$("#mapScreen"), gameScreen=$("#gameScreen"), modal=$("#modal");
const totalStarsEl=$("#totalStars"), levelStarsEl=$("#levelStars"), levelLabel=$("#levelLabel"), timeLeftEl=$("#timeLeft");
const problemEl=$("#problem"), monster=$("#monster"), shell=$("#shell"), answerDisplay=$("#answerDisplay"), comboEl=$("#combo"), feedback=$("#feedback");
const timerPill=$(".timer");

let progress = JSON.parse(localStorage.getItem("mathIslandProgress") || '{"unlocked":1,"stars":{},"total":0}');
if(!progress.stars) progress.stars={};
let soundOn = localStorage.getItem("mathIslandSound") !== "off";

let level=1, questions=[], qIndex=0, current=null, input="", levelStars=0, correct=0, wrongAttempts=0, combo=0, bossStreak=0;
let seconds=60, timer=null, active=false, audioCtx=null;

function save(){ localStorage.setItem("mathIslandProgress", JSON.stringify(progress)); }
function beep(freq=440,dur=.1,type="sine",vol=.06){
  if(!soundOn) return;
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function successSound(){ beep(660,.08,"square",.05); setTimeout(()=>beep(880,.12,"square",.04),70); }
function failSound(){ beep(170,.15,"sawtooth",.045); }
function winSound(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",.05),i*110)); }

function levelConfig(lv){
  if(lv<=2) return {max:10, ops:["+"], minA:1};
  if(lv<=5) return {max:10, ops:["+","-"], minA:1};
  if(lv<=7) return {max:15, ops:["+"], minA:2};
  if(lv<=10) return {max:15, ops:["+","-"], minA:2};
  if(lv<=12) return {max:20, ops:["+"], minA:3};
  return {max:20, ops:["+","-"], minA:3};
}
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function makeQuestion(lv){
  const c=levelConfig(lv), op=c.ops[rand(0,c.ops.length-1)];
  let a,b,ans;
  if(op==="+"){ ans=rand(Math.max(2,c.minA+1),c.max); a=rand(c.minA,ans-1); b=ans-a; }
  else{ a=rand(Math.max(3,c.minA+1),c.max); b=rand(1,a); ans=a-b; }
  return {a,b,op,ans};
}
function buildQuestions(lv){
  const arr=[], seen=new Set();
  while(arr.length<10){
    const q=makeQuestion(lv), key=`${q.a}${q.op}${q.b}`;
    if(!seen.has(key)){ seen.add(key); arr.push(q); }
  }
  return arr;
}
function renderMap(){
  totalStarsEl.textContent=progress.total||0;
  const groups=[["forestLevels",1,5],["desertLevels",6,10],["snowLevels",11,15],["grassLevels",16,19],["fireLevels",20,20]];
  for(const [id,a,b] of groups){
    const box=$("#"+id); box.innerHTML="";
    for(let lv=a; lv<=b; lv++){
      const btn=document.createElement("button");
      btn.className="level"+(lv===20?" boss":"")+(lv>progress.unlocked?" locked":"");
      const best=progress.stars[lv]||0;
      btn.innerHTML=`<span class="num">${lv===20?"👑 20":lv}</span><span class="stars">${best?("⭐ "+best):"　"}</span>${lv>progress.unlocked?'<span class="lock">🔒</span>':""}`;
      btn.disabled=lv>progress.unlocked;
      btn.onclick=()=>startLevel(lv);
      box.appendChild(btn);
    }
  }
}
function sceneFor(lv){
  gameScreen.classList.remove("desert-scene","snow-scene","grass-scene","fire-scene");
  if(lv>=6&&lv<=10) gameScreen.classList.add("desert-scene");
  if(lv>=11&&lv<=15) gameScreen.classList.add("snow-scene");
  if(lv>=16&&lv<=19) gameScreen.classList.add("grass-scene");
  if(lv===20) gameScreen.classList.add("fire-scene");
}
function startLevel(lv){
  level=lv; questions=buildQuestions(lv); qIndex=0; input=""; levelStars=0; correct=0; wrongAttempts=0; combo=0; bossStreak=0; seconds=60; active=true;
  levelLabel.textContent=lv===20?"20 BOSS":lv;
  levelStarsEl.textContent=0; timeLeftEl.textContent=60; answerDisplay.textContent="—";
  timerPill.classList.remove("danger"); sceneFor(lv);
  mapScreen.classList.add("hidden"); gameScreen.classList.remove("hidden"); modal.classList.add("hidden");
  nextQuestion();
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!active) return;
    seconds--; timeLeftEl.textContent=seconds;
    if(seconds<=10) timerPill.classList.add("danger");
    if(seconds<=0){ clearInterval(timer); finish(false,true); }
  },1000);
}
function nextQuestion(){
  input=""; answerDisplay.textContent="—";
  monster.classList.remove("burst","shake"); monster.style.opacity="1";
  current= level===20 ? makeQuestion(20) : questions[qIndex];
  problemEl.textContent=`${current.a} ${current.op} ${current.b} = ?`;
}
function setInput(n){
  if(!active) return;
  if(input.length>=2) return;
  input+=n; answerDisplay.textContent=input;
  beep(340,.035,"sine",.025);
}
function erase(){ if(!active) return; input=input.slice(0,-1); answerDisplay.textContent=input||"—"; }
function showFeedback(text,good=true){
  feedback.textContent=text; feedback.style.color=good?"#2d7a61":"#c13255";
  feedback.classList.remove("show"); void feedback.offsetWidth; feedback.classList.add("show");
}
function showCombo(){
  if(combo<2) return;
  comboEl.textContent=`COMBO ×${combo}!`;
  comboEl.classList.remove("show"); void comboEl.offsetWidth; comboEl.classList.add("show");
}
function sparks(){
  const arena=$(".arena");
  for(let i=0;i<16;i++){
    const s=document.createElement("span");
    s.className="spark"; s.style.left="50%"; s.style.top="26%";
    s.style.setProperty("--dx",`${rand(-120,120)}px`);
    s.style.setProperty("--dy",`${rand(-100,100)}px`);
    arena.appendChild(s); setTimeout(()=>s.remove(),650);
  }
}
function shoot(){
  if(!active || input==="") return;
  const value=Number(input);
  shell.textContent=value;
  shell.classList.remove("fly"); void shell.offsetWidth; shell.classList.add("fly");
  beep(220,.07,"square",.05);
  setTimeout(()=>{
    shell.classList.remove("fly");
    if(value===current.ans) handleCorrect();
    else handleWrong();
  },600);
}
function handleCorrect(){
  correct++; combo++; levelStars++; levelStarsEl.textContent=levelStars; successSound(); showCombo(); showFeedback("命中！⭐ +1",true);
  monster.classList.add("burst"); sparks();
  if(level===20) bossStreak++;
  setTimeout(()=>{
    if(level===20){
      if(bossStreak>=10){ finish(true,false); return; }
      nextQuestion();
    }else{
      qIndex++;
      if(qIndex>=10){ finish(true,false); return; }
      nextQuestion();
    }
  },560);
}
function handleWrong(){
  wrongAttempts++; combo=0;
  if(level===20) bossStreak=0;
  failSound();
  showFeedback(level===20?"没打中！Boss连击归零，再试一次":"没打中，再试一次！",false);
  monster.classList.remove("shake"); void monster.offsetWidth; monster.classList.add("shake");
  input=""; answerDisplay.textContent="—";
}
function finish(cleared,timeUp){
  if(!active) return;
  active=false; clearInterval(timer);
  let bonus=0;
  if(cleared && correct>=10 && wrongAttempts===0){
    bonus=Math.max(0,seconds);
    levelStars+=bonus;
  }
  const title = cleared ? (level===20 ? "🏆 Boss 被击败！" : "🎉 过关！") : "⏰ 时间到！";
  $("#modalTitle").textContent=title;
  $("#modalScore").textContent=`⭐ ${levelStars}`;
  let txt= level===20 ? `Boss 连续命中：${bossStreak}/10` : `答对：${correct}/10`;
  txt += `<br>本关星星：${levelStars}`;
  if(bonus>0) txt += `<br>全对无误！剩余 ${seconds} 秒 → 额外 ⭐ ${bonus}`;
  if(!cleared) txt += `<br>再挑战一次吧！`;
  $("#modalText").innerHTML=txt;
  $("#nextBtn").classList.toggle("hidden", !cleared || level===20);
  if(cleared){
    const old=progress.stars[level]||0;
    if(levelStars>old){
      progress.stars[level]=levelStars;
      progress.total=(progress.total||0)+(levelStars-old);
    }
    if(level<20) progress.unlocked=Math.max(progress.unlocked,level+1);
    save(); winSound();
  }
  modal.classList.remove("hidden");
}
function goMap(){ active=false; clearInterval(timer); modal.classList.add("hidden"); gameScreen.classList.add("hidden"); mapScreen.classList.remove("hidden"); renderMap(); }

document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>setInput(b.dataset.n));
$("#eraseBtn").onclick=erase;
$("#fireBtn").onclick=shoot;
$("#backBtn").onclick=goMap;
$("#mapBtn").onclick=goMap;
$("#retryBtn").onclick=()=>startLevel(level);
$("#nextBtn").onclick=()=>startLevel(level+1);
document.addEventListener("keydown",e=>{
  if(gameScreen.classList.contains("hidden")) return;
  if(/^\d$/.test(e.key)) setInput(e.key);
  if(e.key==="Backspace") erase();
  if(e.key==="Enter") shoot();
});
$("#soundBtn").onclick=()=>{
  soundOn=!soundOn;
  localStorage.setItem("mathIslandSound", soundOn ? "on" : "off");
  $("#soundBtn").textContent = soundOn ? "🔊 音效：开" : "🔇 音效：关";
  if(soundOn) beep(520,.08);
};
$("#resetBtn").onclick=()=>{
  if(confirm("确定要清除所有关卡和星星记录吗？")){
    progress={unlocked:1,stars:{},total:0}; save(); renderMap();
  }
};
$("#soundBtn").textContent = soundOn ? "🔊 音效：开" : "🔇 音效：关";
renderMap();
})();
</script>
